name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "content/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 24.04 images come with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate content
        run: python3 tools/validate.py

      - name: Build and test
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          log=android/build.log
          [ -f "$log" ] || exit 0
          grep -E "^e: |FAILED|What went wrong|AssertionError|Exception|^> " "$log" \
            | grep -v "^> Task" | head -40 > errors.txt || true
          split -l 4 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build error::$msg"
          done

      - name: Publish APK as the latest release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" drive-learning.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest drive-learning.apk \
            --title "Drive Learning (build ${{ github.run_number }})" \
            --notes "גרסה אחרונה. להתקנה: להוריד את drive-learning.apk בטלפון ולפתוח אותו." \
            --latest
